name: CoreFit Android APK Build
on:
  push:
    branches: [ main ]
    paths: ['mobile/android/**','.github/workflows/android-build.yml']
  pull_request:
    branches: [ main ]
    paths: ['mobile/android/**','.github/workflows/android-build.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile/android } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.6.0' }
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: corefit-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
