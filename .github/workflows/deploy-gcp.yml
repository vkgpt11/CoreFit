name: Deploy CoreFit to GCP

on:
  workflow_dispatch:

env:
  REGION: asia-south1
  REPOSITORY: corefit

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and deploy backend
        run: |
          BACKEND_IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/backend:${GITHUB_SHA}"
          gcloud builds submit backend --tag "$BACKEND_IMAGE"
          gcloud run deploy corefit-backend --image "$BACKEND_IMAGE" --region "$REGION" --platform managed --quiet
      - name: Build and deploy admin web
        run: |
          ADMIN_IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/admin-web:${GITHUB_SHA}"
          gcloud builds submit admin-web --tag "$ADMIN_IMAGE"
          gcloud run deploy corefit-admin-web --image "$ADMIN_IMAGE" --region "$REGION" --platform managed --quiet
